services:
  - type: web
    name: chikoro-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Chikoro Digital API
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: chikoro-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: https://chikoro-web.onrender.com,https://chikoro-admin.onrender.com

  - type: web
    name: chikoro-web
    env: node
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chikoro-api.onrender.com

  - type: web
    name: chikoro-admin
    env: node
    buildCommand: cd admin && npm install && npm run build
    startCommand: cd admin && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chikoro-api.onrender.com

  - type: worker
    name: chikoro-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker/worker.py

databases:
  - name: chikoro-db
    databaseName: chikoro
    user: chikoro
