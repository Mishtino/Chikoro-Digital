services:
  - type: web
    name: Chikoro-Digital
    runtime: python
    region: frankfurt
    plan: free
    rootDir: api
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Chikoro Digital API
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      # Set this in Render to the Supabase PostgreSQL connection string.
      # Keep the value secret; do not commit it to this file.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: https://chikoro-digital-d9ge.vercel.app,https://chikoro-digital-d9ge-vortex-technologies.vercel.app,https://chikoro-digital.vercel.app,https://chikoro-digital-vortex-technologies.vercel.app
      - key: PAYNOW_RETURN_URL
        value: https://chikoro-digital-d9ge.vercel.app/paynow/return
      - key: PAYNOW_RESULT_URL
        value: https://chikoro-digital.onrender.com/paynow/webhook
