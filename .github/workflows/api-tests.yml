name: API tests

on:
  push:
    paths:
      - "api/**"
      - "web/**"
      - "admin/**"
      - "supabase/**"
      - "docs/**"
      - "scripts/**"
      - "docker-compose.local.yml"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - "admin/**"
      - "supabase/**"
      - "docs/**"
      - "scripts/**"
      - "docker-compose.local.yml"
      - ".github/workflows/api-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chikoro_local
          POSTGRES_USER: chikoro_local
          POSTGRES_PASSWORD: local_only_change_me
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U chikoro_local -d chikoro_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run API tests
        env:
          ENV: test
          DEBUG: "false"
        run: python -m pytest -q api/tests
      - name: Rehearse verified identity bootstrap under isolated PostgreSQL RLS
        env:
          ENV: test
          DEBUG: "false"
          DATABASE_URL: postgresql://chikoro_local:local_only_change_me@127.0.0.1:55432/chikoro_local
          CHIKORO_REHEARSAL_IDENTITY: "yes"
        run: python scripts/rehearse_tenant_identity.py
      - name: Rehearse financial migration against isolated PostgreSQL 17
        env:
          DATABASE_URL: postgresql://chikoro_local:local_only_change_me@127.0.0.1:55432/chikoro_local
          CHIKORO_REHEARSAL_EMPTY_DATABASE: "yes"
        run: python scripts/rehearse_financial_migration.py
      - name: Rehearse tenant context and RLS against isolated PostgreSQL 17
        env:
          DATABASE_URL: postgresql://chikoro_local:local_only_change_me@127.0.0.1:55432/chikoro_local
          CHIKORO_REHEARSAL_TENANT_CONTEXT: "yes"
        run: python scripts/rehearse_tenant_context.py

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build web portal
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        run: npm install --no-audit --no-fund
      - name: Build admin portal
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
